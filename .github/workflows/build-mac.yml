name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-14-arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore config.json from secret
        env:
          CONFIG_JSON_B64: ${{ secrets.CONFIG_JSON_BASE64 }}
        run: |
          if [ -n "$CONFIG_JSON_B64" ]; then
            echo "$CONFIG_JSON_B64" | base64 --decode > config.json
            echo "config.json restored from secret"
          else
            echo "::warning::CONFIG_JSON_BASE64 secret not set; writing placeholder config.json. App cannot connect to database until the secret is configured."
            cat > config.json <<'EOF'
{
  "database": {
    "server": "127.0.0.1",
    "port": 1588,
    "database": "伯俊库",
    "user": "sa",
    "password": ""
  },
  "server": { "port": 3000 },
  "auth": { "enforce": false, "defaultPassword": "8888", "jwtExpiresIn": "12h" },
  "client": { "apiBase": "/api" }
}
EOF
          fi
          echo "--- config.json ---"
          cat config.json
          echo "--------------------"

      - name: Install dependencies
        run: npm ci

      - name: Build client & server
        run: npm run build

      - name: Package macOS dmg (${{ matrix.arch }})
        run: npm run dist:mac -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload dmg artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer-${{ matrix.arch }}
          path: |
            dist-electron/Mac/*
          if-no-files-found: error